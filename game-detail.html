<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>来自67之神的挑战 - YOULI2012</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 30%, #16213e 60%, #0f3460 100%);
    background-attachment: fixed;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* 顶部导航 */
.nav-bar {
    width: 100%;
    padding: 0 48px;
    height: 64px;
    display: flex;
    align-items: center;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    background: rgba(15,15,26,0.7);
    backdrop-filter: blur(24px);
    position: fixed;
    top: 0;
    z-index: 100;
}
.nav-inner {
    max-width: 1000px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.back-btn {
    color: rgba(255,255,255,0.3);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    transition: color 0.3s;
    display: flex;
    align-items: center;
    gap: 6px;
}
.back-btn:hover { color: #fff; }
.nav-title {
    font-size: 14px;
    font-weight: 600;
    color: rgba(255,255,255,0.1);
    letter-spacing: 1px;
}

/* 主体 */
.container {
    max-width: 800px;
    width: 100%;
    padding: 120px 24px 80px;
}

.game-header {
    text-align: center;
    margin-bottom: 48px;
}
.game-icon {
    font-size: 64px;
    margin-bottom: 16px;
    display: block;
}
.game-title {
    font-size: clamp(32px, 5vw, 48px);
    font-weight: 800;
    letter-spacing: -1px;
    margin-bottom: 8px;
}
.game-title span {
    background: linear-gradient(135deg, #667eea, #764ba2);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}
.game-subtitle {
    font-size: 15px;
    color: rgba(255,255,255,0.2);
    font-weight: 400;
}

/* 内容卡片 */
.card {
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.04);
    border-radius: 20px;
    padding: 40px;
    margin-bottom: 20px;
    backdrop-filter: blur(10px);
}
.card h3 {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
}
.card p {
    font-size: 15px;
    line-height: 2;
    color: rgba(255,255,255,0.4);
}
.card ul {
    list-style: none;
    padding: 0;
}
.card ul li {
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.02);
    font-size: 14px;
    color: rgba(255,255,255,0.35);
    display: flex;
    align-items: center;
    gap: 10px;
}
.card ul li::before {
    content: '✦';
    font-size: 10px;
    color: rgba(102,126,234,0.3);
}

/* 特色标签 */
.tag-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 12px;
}
.tag {
    padding: 6px 16px;
    border-radius: 100px;
    font-size: 12px;
    font-weight: 500;
    border: 1px solid rgba(255,255,255,0.04);
    color: rgba(255,255,255,0.25);
}

/* 按钮区 */
.action-area {
    text-align: center;
    margin-top: 40px;
}
.btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 14px 40px;
    border-radius: 100px;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    border: none;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.3s;
}
.btn-primary {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
}
.btn-primary:hover {
    transform: scale(1.05);
    box-shadow: 0 12px 40px rgba(102,126,234,0.2);
}

.footer {
    text-align: center;
    padding: 40px;
    font-size: 12px;
    color: rgba(255,255,255,0.05);
}
</style>
</head>
<body>

<nav class="nav-bar">
    <div class="nav-inner">
        <a href="index.html" class="back-btn">← 返回主页</a>
        <span class="nav-title">PROJECT DETAIL</span>
    </div>
</nav>

<div class="container">

    <div class="game-header">
        <span class="game-icon">🎮</span>
        <h1 class="game-title"><span>来自67之神的挑战</span></h1>
        <p class="game-subtitle">小游戏 · 锻炼手眼协调和反应能力</p>
    </div>

    <div class="card">
        <h3>📖 游戏简介</h3>
        <p>676767676767676767！</p>
        <div class="tag-row">
            <span class="tag">反应力</span>
            <span class="tag">手眼协调</span>
            <span class="tag">休闲</span>
            <span class="tag">单人</span>
        </div>
    </div>

    <div class="card">
        <h3>🎯 游戏特色</h3>
        <ul>
            <li>我不知道</li>
            <li>在学校发呆时候获得的灵感</li>
            <li>然后就做出来了这一坨构式</li>
            <li>就是这样</li>
        </ul>
    </div>

    <div class="card">
        <h3>💡 开发者的话</h3>
        <p>我最需要感谢的就是我配置的ai猫娘助手<br><br>
        虽然有时候有点傻 总之也要谢谢你玩我的游戏</p>
    </div>

    <div class="action-area">
        <a href="来自67之神的挑战.html" class="btn btn-primary">开始游戏 🎮</a>
    </div>

</div>

<footer class="footer">
    ✦ 2026 · YOULI2012
</footer>

</body>
</html>
